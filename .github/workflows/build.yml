name: Build & Release Silo (Daemon + KSU Module + APK)

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish GitHub Release with APK, KSU Module ZIP, and SHA256SUMS"
        type: boolean
        default: true
      release_tag:
        description: "Release tag (leave empty for auto tag)"
        type: string
        default: ""
      prerelease:
        description: "Mark release as pre-release"
        type: boolean
        default: false

jobs:
  daemon-and-module:
    name: "Rust silod (ARM64 Static) & KernelSU Module"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain & aarch64-unknown-linux-musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-musl

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('daemon/Cargo.toml', 'daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy & Rust Unit/Integration Tests
        working-directory: daemon
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --verbose

      - name: Cross-compile static ARM64 silod
        working-directory: daemon
        run: |
          cargo build --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/silod
          ls -lh target/aarch64-unknown-linux-musl/release/silod

      - name: Validate KernelSU module shell scripts & package ZIP
        run: |
          sh -n module/customize.sh
          sh -n module/service.sh
          sh -n module/action.sh
          sh -n module/uninstall.sh
          bash -n scripts/build_module.sh
          chmod +x scripts/build_module.sh
          ./scripts/build_module.sh \
            daemon/target/aarch64-unknown-linux-musl/release/silod \
            dist/silo-ksu-module.zip

      - name: Verify Zero-Mount Stealth Invariant on Module ZIP
        run: |
          ZIP_ENTRIES="$(unzip -Z1 dist/silo-ksu-module.zip)"
          if printf '%s\n' "$ZIP_ENTRIES" | grep -qiE '^(\./)?(system|vendor|product|system_ext|odm)(/|$)'; then
            echo "::error::Stealth invariant violated: forbidden overlay (system/vendor/product/system_ext/odm) found in module ZIP!"
            exit 1
          fi
          for req in module.prop customize.sh service.sh action.sh uninstall.sh bin/silod; do
            if ! printf '%s\n' "$ZIP_ENTRIES" | grep -qxF "$req"; then
              echo "::error::Required module entry missing from ZIP: $req"
              exit 1
            fi
          done
          echo "[OK] Zero-mount stealth invariant & required module entries verified."

      - name: Upload KernelSU Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: silo-ksu-module
          path: dist/silo-ksu-module.zip
          if-no-files-found: error

  android-app:
    name: "Android App (Kotlin Compose APK + Zero-Internet Gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Decode optional Release Keystore from Secrets
        id: signing
        env:
          SILO_KEYSTORE_BASE64: ${{ secrets.SILO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SILO_KEYSTORE_BASE64" ]; then
            printf '%s' "$SILO_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/silo-release.jks"
            chmod 0600 "${RUNNER_TEMP}/silo-release.jks"
            echo "SILO_KEYSTORE_PATH=${RUNNER_TEMP}/silo-release.jks" >> "$GITHUB_ENV"
            echo "Using custom release keystore from repository secrets."
          else
            echo "No SILO_KEYSTORE_BASE64 secret configured; building with fallback signing."
          fi

      - name: Run JVM Unit Tests & Assemble Release APK
        working-directory: app
        env:
          SILO_KEYSTORE_PASSWORD: ${{ secrets.SILO_KEYSTORE_PASSWORD }}
          SILO_KEY_ALIAS: ${{ secrets.SILO_KEY_ALIAS }}
          SILO_KEY_PASSWORD: ${{ secrets.SILO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Security Gate — Verify ZERO INTERNET Permission in Compiled APK
        run: |
          APK_PATH="$(find app/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -f "$APK_PATH" || { echo "::error::Release APK not found!"; exit 1; }
          mkdir -p dist
          cp "$APK_PATH" dist/Silo-release.apk

          AAPT2="$(find "${ANDROID_HOME}/build-tools" -name aapt2 | sort -V | tail -n 1)"
          test -x "$AAPT2" || { echo "::error::aapt2 binary not found under ANDROID_HOME!"; exit 1; }
          echo "=== Merged APK Permissions ($AAPT2) ==="
          "$AAPT2" dump permissions dist/Silo-release.apk
          if "$AAPT2" dump permissions dist/Silo-release.apk | grep -Fq 'android.permission.INTERNET'; then
            echo "::error::Strict Offline-First violated: android.permission.INTERNET detected in APK!"
            exit 1
          fi
          echo "[OK] Verified ZERO android.permission.INTERNET in compiled Release APK."

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: silo-apk
          path: dist/Silo-release.apk
          if-no-files-found: error

  release:
    name: "Publish GitHub Release"
    needs: [ daemon-and-module, android-app ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: Prepare versioned release files & SHA256SUMS
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${INPUT_RELEASE_TAG:-}" ]; then
            TAG="$INPUT_RELEASE_TAG"
          else
            BASE_VERSION="$( (grep -m1 '^version=' module/module.prop || true) | cut -d= -f2- | tr -d '\r\n[:space:]')"
            if [ -z "$BASE_VERSION" ]; then
              echo "::error::Failed to derive version from module/module.prop"
              exit 1
            fi
            case "$BASE_VERSION" in
              v*) ;;
              *) BASE_VERSION="v${BASE_VERSION}" ;;
            esac
            TAG="${BASE_VERSION}-$(date -u +%Y%m%d-%H%M)"
          fi

          if [[ "$TAG" == *".."* ]] || [[ "$TAG" == *$'\n'* ]] || [[ "$TAG" == *$'\r'* ]] || [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]; then
            echo "::error::Invalid or unsafe release tag format: ${TAG}"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p release_out
          cp -- release_staging/silo-apk/Silo-release.apk "release_out/Silo-${TAG}.apk"
          cp -- release_staging/silo-ksu-module/silo-ksu-module.zip "release_out/silo-ksu-module-${TAG}.zip"
          (
            cd release_out
            sha256sum -- "Silo-${TAG}.apk" "silo-ksu-module-${TAG}.zip" > SHA256SUMS.txt
          )
          cat release_out/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          GH_FLAGS=()
          if [ "${INPUT_PRERELEASE:-}" = "true" ]; then
            GH_FLAGS+=(--prerelease)
          fi
          if [[ "${GITHUB_REF:-}" != refs/tags/* ]] && [ -n "${GITHUB_SHA:-}" ]; then
            GH_FLAGS+=(--target "$GITHUB_SHA")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "release_out/Silo-${RELEASE_TAG}.apk" \
              "release_out/silo-ksu-module-${RELEASE_TAG}.zip" \
              "release_out/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "release_out/Silo-${RELEASE_TAG}.apk" \
              "release_out/silo-ksu-module-${RELEASE_TAG}.zip" \
              "release_out/SHA256SUMS.txt" \
              --title "Silo ${RELEASE_TAG}" \
              --notes "Silo ${RELEASE_TAG} — Zero-panic, zero-gimmick Linux 6.x kernel privacy & security suite (static ARM64 Rust \`silod\` KernelSU Module + strict offline-first Kotlin/Compose APK with verified zero \`INTERNET\` permission). Note: update BOTH the KernelSU module ZIP (and reboot) and the APK." \
              "${GH_FLAGS[@]}"
          fi
